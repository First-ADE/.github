name: ADE Axiom Verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Cache bashunit
        id: cache-bashunit
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: lib/bashunit
          key: ${{ runner.os }}-bashunit

      - name: Install bashunit
        if: steps.cache-bashunit.outputs.cache-hit != 'true'
        run: curl -sSL https://bashunit.typeddevs.com/install.sh | bash

      - name: Run ADE Axiom Validation
        run: ./scripts/validate_axioms.sh

      - name: Run BDD Tests
        run: ./scripts/run_bdd_tests.sh

      - name: Run bashunit Test Suite
        run: ./lib/bashunit tests/
