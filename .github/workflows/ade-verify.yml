name: ADE Axiom Verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify-axioms:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache bashunit
        id: cache-bashunit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: lib/bashunit
          key: ${{ runner.os }}-bashunit

      - name: Install bashunit
        if: steps.cache-bashunit.outputs.cache-hit != 'true'
        run: curl -sSL https://bashunit.typeddevs.com/install.sh | bash

      - name: Run ADE Axiom Validation
        run: ./scripts/validate_axioms.sh

      - name: Run BDD Tests
        run: ./scripts/run_bdd_tests.sh

      - name: Run bashunit Test Suite
        run: ./lib/bashunit tests/
