name: Cross-Model Evaluation & Quality Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 0' # Every Sunday at 03:29 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  benchmark-models:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.10'

      - name: Setup Ollama and Pull Primary Model
        uses: ./.github/actions/setup-ollama
        with:
          model: 'qwen2.5-coder:3b'

      - name: Pull Additional Evaluation Models
        run: |
          ollama pull llama3.2:3b
          ollama pull llama3.2:1b

      - name: Run Cross-Model Benchmark
        run: python scripts/evaluate_models.py

      - name: Open Pull Request with Benchmark Results
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7.0.7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: MODEL_BENCHMARK.md
          branch: chore/model-benchmark-report
          delete-branch: true
          commit-message: "chore(benchmark): update cross-model evaluation report"
          title: "chore(benchmark): update cross-model evaluation report"
          body: "Automated update of `MODEL_BENCHMARK.md` from the scheduled cross-model evaluation workflow."
