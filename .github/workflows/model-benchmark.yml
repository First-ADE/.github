name: Cross-Model Evaluation & Quality Benchmark

on:
  workflow_dispatch:
  schedule:
    - cron: '29 3 * * 0' # Every Sunday at 03:29 UTC

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  benchmark-models:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Run Cross-Model Benchmark
        run: |
          python scripts/evaluate_models.py
          if [ -f MODEL_BENCHMARK.md ]; then
            cat MODEL_BENCHMARK.md >> "$GITHUB_STEP_SUMMARY"
          fi